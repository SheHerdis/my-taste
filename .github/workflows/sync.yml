name: Sync Pinterest

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch pins and images
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: python sync.py
      - name: Commit changes
        run: |
          git config user.name "taste-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data images
          git diff --cached --quiet || git commit -m "sync pins $(date -u +%Y-%m-%d)"
          git push
